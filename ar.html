<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Íñigo Fernández del Amo — 3D and AR</title>
  <meta name="description" content="The same knowledge graph in three dimensions, on the marker in the CV.">
  <link rel="icon" href="assets/portrait.jpg">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <div class="rail">
    <div class="brand">
      <img src="assets/portrait.jpg" alt="">
      <span><b>Íñigo</b>Fernández del Amo</span>
    </div>
    <nav aria-label="Views">
      <a href="index.html" title="Curriculum"><svg viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 10h16M4 15h11"/></svg><span class="label">Curriculum</span></a>
      <a href="graph.html" title="Knowledge"><svg viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7.5a2.5 2.5 0 1 1-.001-.001M17 5.5a2 2 0 1 1-.001-.001M17 18a2 2 0 1 1-.001-.001M8.7 8.9l6 7.2M9.1 6.6l6.2-1.4"/></svg><span class="label">Knowledge</span></a>
      <a href="ar.html" aria-current="page" title="Timeline"><svg viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7.2v9.6L12 21l8-4.2V7.2Zm0 0v18m8-13.8L12 12 4 7.2"/></svg><span class="label">Timeline</span></a>
    </nav>
  </div>
  <div class="stage arstage">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono"
             vr-mode-ui="enabled: false" renderer="antialias: true; alpha: true"
             device-orientation-permission-ui="enabled: true">
      <a-marker preset="hiro">
        <a-entity id="cvgraph" cvgraph="src: graph.json"></a-entity>
        <a-entity light="type: hemisphere; intensity: 1.1"></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
    <div class="controls">
      <button type="button" class="action" id="layout">Timeline layout</button>
    </div>
    <div class="hint" id="loading">Point your camera at the marker in the CV header</div>
    <aside id="detail" hidden></aside>
  </div>
  <script src="assets/vendors/aframe.min.js"></script>
  <script src="assets/vendors/aframe-ar.js"></script>
  <script src="assets/ar.js"></script>
</body>
</html>
